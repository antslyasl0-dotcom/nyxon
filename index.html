<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NYXON — إدارة أندية برو كلوب</title>
<meta name="description" content="صدارة اللاعبين والمباريات والتشكيلات لكلان NYXON.">
<meta name="theme-color" content="#0A0E13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NYXON">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-width sticky bar + scrolling tab rail; every view is one column of cards inside a 1120px wrap; wide tables scroll inside their own box */
:root{
  --bg:#0A0E13; --surface:#121922; --surface2:#18212C; --raise:#212C3A;
  --line:#26323F; --line-soft:#1C242E;
  --fg:#E9EEF4; --fg-dim:#B4C0CD; --muted:#7D8B9B;
  --accent:#E8B33C; --accent-ink:#1A1304; --accent-soft:rgba(232,179,60,.13); --accent-line:rgba(232,179,60,.34);
  --good:#38B87C; --good-soft:rgba(56,184,124,.14);
  --mid:#C9772E; --mid-soft:rgba(201,119,46,.16);
  --bad:#D94B50; --bad-soft:rgba(217,75,80,.14);
  --font-d:'Readex Pro',system-ui,-apple-system,sans-serif;
  --font-b:'IBM Plex Sans Arabic','Readex Pro',system-ui,-apple-system,sans-serif;
  --r:12px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EDF1F5; --surface:#FFFFFF; --surface2:#F4F7FA; --raise:#E7ECF2;
    --line:#D6DDE6; --line-soft:#E6EBF1;
    --fg:#101821; --fg-dim:#3B4756; --muted:#64737F;
    --accent:#8A5B00; --accent-ink:#FFFFFF; --accent-soft:rgba(138,91,0,.10); --accent-line:rgba(138,91,0,.26);
    --good:#1C8A57; --good-soft:rgba(28,138,87,.12);
    --mid:#95510F; --mid-soft:rgba(149,81,15,.12);
    --bad:#B4262C; --bad-soft:rgba(180,38,44,.10);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EDF1F5; --surface:#FFFFFF; --surface2:#F4F7FA; --raise:#E7ECF2;
  --line:#D6DDE6; --line-soft:#E6EBF1;
  --fg:#101821; --fg-dim:#3B4756; --muted:#64737F;
  --accent:#8A5B00; --accent-ink:#FFFFFF; --accent-soft:rgba(138,91,0,.10); --accent-line:rgba(138,91,0,.26);
  --good:#1C8A57; --good-soft:rgba(28,138,87,.12);
  --mid:#95510F; --mid-soft:rgba(149,81,15,.12);
  --bad:#B4262C; --bad-soft:rgba(180,38,44,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1120px;margin-inline:auto}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--font-d);font-weight:600;margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}

/* ---- top bar ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:11px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-weight:700;letter-spacing:.14em;font-size:17px;color:var(--accent);line-height:1}
.mark img{width:36px;height:36px;border-radius:10px;display:block;flex:0 0 auto;background:#0A0E13}
.mark small{display:block;letter-spacing:0;font-size:10.5px;font-weight:400;color:var(--muted);margin-top:3px}
.bar-end{margin-inline-start:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---- tab rail ---- */
.rail{background:var(--bg);border-bottom:1px solid var(--line-soft)}
.rail .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:8px}
.rail .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:none;border:1px solid transparent;color:var(--muted);font-family:var(--font-d);font-size:13.5px;font-weight:500;padding:7px 14px;border-radius:999px;cursor:pointer}
.tab:hover{color:var(--fg-dim)}
.tab[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}

main{display:block;padding-block:20px 48px}
main .wrap{display:flex;flex-direction:column;gap:18px}

/* ---- blocks ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card>.pad{padding:16px}
.card-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.card-h h2,.card-h h3{font-size:16px}
.card-h .sub{font-size:12.5px;color:var(--muted)}
.card-h .end{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.sec-title{font-family:var(--font-d);font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}

.btn{font-family:var(--font-d);font-size:13px;font-weight:500;padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);color:var(--fg-dim);cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--fg);border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{font-size:12px;padding:5px 10px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.slot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);font-family:var(--font-d);font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-family:var(--font-d);padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--fg-dim);white-space:nowrap}
.chip.gold{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.chip.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.mid{background:var(--mid-soft);border-color:transparent;color:var(--mid)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}

label{display:block;font-size:12px;color:var(--muted);font-family:var(--font-d);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--fg);border-radius:9px;padding:9px 11px;font-family:var(--font-b);font-size:14px}
input[type="number"]{font-variant-numeric:tabular-nums}
textarea{min-height:88px;resize:vertical}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread .end{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}

.tbox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 10px;text-align:start;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{font-family:var(--font-d);font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em}
td.num,th.num{font-variant-numeric:tabular-nums;text-align:center}
tbody tr:last-child td{border-bottom:0}
tr.me{background:var(--accent-soft)}
td.who{white-space:normal;min-width:150px}
.who b{font-weight:600}
.who span{display:block;font-size:11.5px;color:var(--muted)}
.rank{font-family:var(--font-d);font-weight:600;width:38px;text-align:center;color:var(--muted)}
tr.p1 .rank{color:var(--accent)}
tr.p1 td{background:var(--accent-soft)}
td.pts{font-family:var(--font-d);font-weight:600;color:var(--fg);direction:ltr;unicode-bidi:isolate}

/* admin mode wears a gold rail; a player's view stays quiet */
#app[data-mode="admin"] .bar{border-bottom-color:var(--accent-line);box-shadow:inset 0 -2px 0 -1px var(--accent-line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.tile{background:var(--surface2);border:1px solid var(--line-soft);border-radius:11px;padding:12px 13px;min-width:0}
.tile b{display:block;font-family:var(--font-d);font-size:25px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;text-align:right}
.tile span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.tile.hi{background:var(--accent-soft);border-color:var(--accent-line)}
.tile.hi b{color:var(--accent)}
button.tile{display:block;width:100%;font-family:inherit;font-size:inherit;text-align:start;color:inherit;cursor:pointer}
button.tile:hover{border-color:var(--muted)}
.big{display:flex;gap:10px;flex-wrap:wrap}
.big .btn{flex:1 1 150px;text-align:center;padding:13px 16px;font-size:14.5px}
.next{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.next .k{font-family:var(--font-d);font-size:21px;font-weight:600;line-height:1.3}
.next .k small{display:block;font-family:var(--font-b);font-size:12.5px;font-weight:400;color:var(--muted);margin-top:3px}
.next .cd{margin-inline-start:auto;text-align:center;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:11px;padding:9px 15px;color:var(--accent);font-family:var(--font-d);font-size:14px;font-weight:600}
.todo{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.todo:last-child{border-bottom:0}
.todo .t{min-width:0;font-size:13.5px}
.todo .t b{display:block;font-family:var(--font-d);font-weight:600}
.todo .t span{color:var(--muted);font-size:12px}
.todo .end{margin-inline-start:auto;display:flex;gap:7px;flex-wrap:wrap}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-family:var(--font-d);font-size:12px;font-weight:600}
.med{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-family:var(--font-d);font-size:12.5px;font-weight:700}
tr.p1 .med{background:var(--accent);color:var(--accent-ink)}
tr.p2 .med{background:#B6C0CB;color:#141D27}
tr.p3 .med{background:#C4823E;color:#1A1105}
@media (max-width:560px){
  .mrow .when{min-width:100%}
  .mrow .acts{margin-inline-start:0;width:100%}
  .next .cd{margin-inline-start:0}
}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.empty strong{display:block;font-family:var(--font-d);font-size:15px;color:var(--fg-dim);font-weight:600;margin-bottom:6px}
.empty .btn{margin-top:14px}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
.warnbox{border:1px solid var(--mid-soft);background:var(--mid-soft);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--fg-dim)}

/* ---- match rows ---- */
.mrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.mrow:last-child{border-bottom:0}
.mrow .when{font-family:var(--font-d);font-size:12.5px;color:var(--muted);min-width:132px;font-variant-numeric:tabular-nums}
.mrow .vs{font-family:var(--font-d);font-weight:600;font-size:15px}
.mrow .vs small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);font-family:var(--font-b)}
.mrow .acts{margin-inline-start:auto;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.score{font-family:var(--font-d);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.04em;direction:ltr;unicode-bidi:isolate}
.att{display:flex;gap:6px;flex-wrap:wrap}

/* ---- pitch ---- */
.pitch{position:relative;direction:ltr;aspect-ratio:72/100;max-width:430px;width:100%;margin-inline:auto;border-radius:14px;border:1px solid var(--line);background:
  linear-gradient(0deg,rgba(120,142,126,.09) 0 10%,transparent 10% 20%,rgba(120,142,126,.09) 20% 30%,transparent 30% 40%,rgba(120,142,126,.09) 40% 50%,transparent 50% 60%,rgba(120,142,126,.09) 60% 70%,transparent 70% 80%,rgba(120,142,126,.09) 80% 90%,transparent 90% 100%),
  var(--surface2)}
.pitch i{position:absolute;border:1px solid var(--line);pointer-events:none}
.pitch .mid{inset:50% 0 auto 0;border-width:1px 0 0 0}
.pitch .circ{left:50%;top:50%;width:27%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%}
.pitch .box{left:21%;width:58%;height:15%;bottom:0;border-bottom:0}
.pitch .box2{left:21%;width:58%;height:15%;top:0;border-top:0}
.slot{position:absolute;transform:translate(-50%,-50%);width:66px;text-align:center;background:none;border:0;cursor:pointer;padding:0;color:inherit}
.slot .dot{width:40px;height:40px;margin:0 auto;border-radius:50%;background:var(--raise);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:11px;font-weight:600;color:var(--muted)}
.slot.on .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.slot .nm{display:block;font-size:10.5px;margin-top:4px;line-height:1.3;color:var(--fg-dim);font-family:var(--font-d);overflow-wrap:anywhere}
.slot.on .nm{color:var(--fg)}
.slot:disabled{cursor:default}

/* ---- modal / toast ---- */
.modal{position:fixed;inset:0;z-index:60;background:rgba(5,8,11,.72);display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:600px){.modal{align-items:center;padding:24px}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:620px;max-height:88vh;display:flex;flex-direction:column}
@media (min-width:600px){.sheet{border-radius:16px}}
.sheet-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line-soft)}
.sheet-h h3{font-size:16px}
.sheet-h button{margin-inline-start:auto;background:none;border:0;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
.sheet-b{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet-f{padding:14px 18px;border-bottom:0;border-top:1px solid var(--line-soft);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.pick{display:flex;flex-direction:column;gap:6px;max-height:48vh;overflow-y:auto}
.pick button{text-align:start;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--fg);cursor:pointer;font-family:var(--font-b);font-size:13.5px}
.pick button:hover{border-color:var(--accent-line)}
.pick button b{font-weight:600}
.pick button span{color:var(--muted);font-size:11.5px;margin-inline-start:6px}
.srow{display:grid;grid-template-columns:minmax(118px,1.3fr) repeat(auto-fit,minmax(58px,1fr));gap:8px;align-items:end;padding-block:10px;border-bottom:1px solid var(--line-soft)}
.srow:last-child{border-bottom:0}
.srow .pn{font-size:12.5px;line-height:1.35}
.srow .pn b{display:block;font-weight:600}
.srow .pn span{color:var(--muted);font-size:11px}
.srow input[type="number"]{padding:7px 8px;font-size:13px;text-align:center}
.srow label{font-size:10.5px;margin-bottom:3px;white-space:nowrap}
.tick{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--fg-dim);font-family:var(--font-d)}
.tick input{width:17px;height:17px;accent-color:var(--accent)}
.srow .pr{font-family:var(--font-d);font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
#toast{position:fixed;z-index:70;inset-block-end:max(18px,env(safe-area-inset-bottom,0px));inset-inline:0;display:flex;justify-content:center;pointer-events:none}
#toast div{background:var(--raise);border:1px solid var(--line);color:var(--fg);font-size:13px;padding:9px 16px;border-radius:999px;font-family:var(--font-d)}
.foot{border-top:1px solid var(--line-soft);background:var(--surface)}
.foot .wrap{padding-block:18px 26px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(14px);opacity:.6}}}

/* ---- splash: holds the first paint so the app never opens on a blank page ---- */
#splash{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
#splash img{width:96px;height:96px;border-radius:24px;display:block;background:#0A0E13}
#splash .wm{font-family:var(--font-d);font-weight:700;letter-spacing:.3em;font-size:22px;color:var(--accent);
  padding-inline-start:.3em}
#splash .wm small{display:block;letter-spacing:0;font-size:12.5px;font-weight:400;color:var(--muted);margin-top:8px}
#splash .barline{width:132px;height:3px;border-radius:999px;background:var(--line-soft);overflow:hidden}
#splash .barline i{display:block;width:40%;height:100%;border-radius:999px;background:var(--accent)}
#splash.off{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  #splash{transition:opacity .28s ease}
  #splash img{animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
  #splash .barline i{animation:slide 1.1s ease-in-out infinite}
  @keyframes pop{from{transform:scale(.88);opacity:0}}
  @keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
}
@media (prefers-reduced-motion:reduce){#splash .barline{display:none}}

/* ---- avatars ---- */
.av{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;flex:0 0 auto;
  border-radius:50%;overflow:hidden;background:var(--raise);border:1px solid var(--line);
  font-family:var(--font-d);font-size:12.5px;font-weight:600;color:var(--muted);vertical-align:middle;line-height:1}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.ph{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.av.sm{width:28px;height:28px;font-size:11px}
.av.lg{width:58px;height:58px;font-size:20px}
.av.xl{width:84px;height:84px;font-size:28px}
.wh{display:flex;gap:9px;align-items:center}
.wh .tx{min-width:0}
.card-h.prof{align-items:center}
.slot .dot img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.slot.on .dot{overflow:hidden}
</style>

<div id="app" dir="rtl">
  <header class="bar"><div class="wrap">
    <div class="mark"><img src="icon-192.png" alt="NYXON" width="36" height="36"><span>NYXON<small>إدارة أندية برو كلوب</small></span></div>
    <div class="bar-end" id="barEnd"></div>
  </div></header>
  <nav class="rail"><div class="wrap" id="rail"></div></nav>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function n(v){var x=Number(v);return isFinite(x)?x:0}
function fmt(v){var x=n(v);return Number.isInteger(x)?String(x):(Math.round(x*10)/10).toFixed(1)}
function uid(){return "x"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function byId(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null}

/* ---------- domain ---------- */
var POS=[
 {id:"GK",ar:"حارس",cat:"GK"},{id:"CB",ar:"قلب دفاع",cat:"CB"},
 {id:"LB",ar:"ظهير أيسر",cat:"FB"},{id:"RB",ar:"ظهير أيمن",cat:"FB"},
 {id:"CDM",ar:"ارتكاز",cat:"CDM"},{id:"CM",ar:"وسط",cat:"CM"},{id:"CAM",ar:"صانع ألعاب",cat:"CAM"},
 {id:"LW",ar:"جناح أيسر",cat:"W"},{id:"RW",ar:"جناح أيمن",cat:"W"},{id:"ST",ar:"مهاجم",cat:"ST"}];
var CAT=[
 {id:"GK",ar:"حارس",code:"GK",key:"cleanSheets",keyAr:"كلين شيت"},
 {id:"CB",ar:"قلب دفاع",code:"CB",key:"tackles",keyAr:"تدخلات"},
 {id:"FB",ar:"ظهير",code:"LB/RB",key:"tackles",keyAr:"تدخلات"},
 {id:"CDM",ar:"ارتكاز",code:"CDM",key:"tackles",keyAr:"تدخلات"},
 {id:"CM",ar:"وسط",code:"CM",key:"passes",keyAr:"تمريرات"},
 {id:"CAM",ar:"صانع ألعاب",code:"CAM",key:"assists",keyAr:"أسيست"},
 {id:"W",ar:"جناح",code:"LW/RW",key:"goals",keyAr:"أهداف"},
 {id:"ST",ar:"مهاجم",code:"ST",key:"goals",keyAr:"أهداف"}];
var ROLES=[{id:"admin",ar:"إدارة"},{id:"captain",ar:"كابتن"},{id:"vice",ar:"نائب كابتن"},{id:"player",ar:"لاعب"}];
var WKEYS=[{k:"goal",ar:"هدف"},{k:"assist",ar:"أسيست"},{k:"shot",ar:"تسديدة على المرمى"},{k:"tackle",ar:"تدخل ناجح"},
 {k:"pass10",ar:"كل 10 تمريرات"},{k:"cleanSheet",ar:"كلين شيت"},{k:"save",ar:"تصدي"},{k:"conceded",ar:"هدف دخل عليه"}];
var DEF_SCORING={global:{win:2,draw:1,motm:3,red:-3},cats:{
 GK:{cleanSheet:5,save:1,conceded:-1},
 CB:{cleanSheet:4,tackle:1,goal:4,assist:3},
 FB:{cleanSheet:3,tackle:1,goal:4,assist:3},
 CDM:{tackle:1,pass10:1,cleanSheet:2,goal:4,assist:3},
 CM:{pass10:1,goal:3,assist:3,tackle:0.5},
 CAM:{assist:4,goal:3,shot:0.5},
 W:{goal:3,assist:3,shot:0.5},
 ST:{goal:3,assist:2,shot:0.5}}};
var FORMS={
 "4-3-3":[["GK",50,91],["LB",11,71],["CB",34,76],["CB",66,76],["RB",89,71],["CM",24,50],["CDM",50,56],["CM",76,50],["LW",15,23],["ST",50,14],["RW",85,23]],
 "4-2-3-1":[["GK",50,91],["LB",11,71],["CB",34,76],["CB",66,76],["RB",89,71],["CDM",35,58],["CDM",65,58],["LW",15,35],["CAM",50,34],["RW",85,35],["ST",50,13]],
 "4-4-2":[["GK",50,91],["LB",11,71],["CB",34,76],["CB",66,76],["RB",89,71],["LW",12,48],["CM",38,51],["CM",62,51],["RW",88,48],["ST",37,17],["ST",63,17]],
 "4-2-2-2":[["GK",50,91],["LB",11,71],["CB",34,76],["CB",66,76],["RB",89,71],["CDM",35,59],["CDM",65,59],["LW",18,36],["RW",82,36],["ST",37,14],["ST",63,14]],
 "3-5-2":[["GK",50,91],["CB",25,77],["CB",50,79],["CB",75,77],["LB",9,52],["CM",32,50],["CDM",50,57],["CM",68,50],["RB",91,52],["ST",37,17],["ST",63,17]],
 "5-3-2":[["GK",50,91],["LB",9,69],["CB",29,77],["CB",50,79],["CB",71,77],["RB",91,69],["CM",29,49],["CDM",50,53],["CM",71,49],["ST",37,17],["ST",63,17]],
 "4-3-2-1":[["GK",50,91],["LB",11,71],["CB",34,76],["CB",66,76],["RB",89,71],["CM",24,55],["CDM",50,59],["CM",76,55],["CAM",32,32],["CAM",68,32],["ST",50,13]]};

function catOf(posId){var p=byId(POS,posId);return p?p.cat:"CM"}
function posAr(id){var p=byId(POS,id);return p?p.ar:id}
function catOb(id){return byId(CAT,id)||CAT[0]}

/* ---------- state ---------- */
var S={db:null,user:null,uid:null,canWrite:null,adminLevel:false,offline:false,slow:false,booted:false,attIdx:{},
 scoring:DEF_SCORING,cfg:{minMatches:5,seasonStart:""},
 clubs:[],players:[],matches:[],cups:[],posts:[],requests:[],claims:[],
 got:{},view:"leaders",modal:false,
 ui:{period:"season",scope:"all",cat:"goals",lineupMatch:"",confirmedOnly:true,allPast:false,cup:""}};
var ALLVIEWS=[{id:"home",ar:"ملفي"},{id:"cap",ar:"لوحة الكابتن"},{id:"board",ar:"الإدارة"},{id:"leaders",ar:"الصدارة"},{id:"matches",ar:"المباريات"},{id:"lineups",ar:"التشكيلات"},{id:"cups",ar:"البطولات"},{id:"clan",ar:"الكلان"}];
function views(){
  if(isAdmin())return [{id:"board",ar:"الإدارة"},{id:"leaders",ar:"الصدارة"},{id:"matches",ar:"المباريات"},{id:"lineups",ar:"التشكيلات"},{id:"cups",ar:"البطولات"},{id:"clan",ar:"الكلان"}];
  if(isCap()||isVice())return [{id:"cap",ar:"لوحة الكابتن"},{id:"home",ar:"ملفي"},{id:"leaders",ar:"الصدارة"},{id:"matches",ar:"المباريات"},{id:"lineups",ar:"التشكيلة"},{id:"cups",ar:"البطولات"}];
  return [{id:"home",ar:me()?"ملفي":"الرئيسية"},{id:"leaders",ar:"الصدارة"},{id:"matches",ar:"المباريات"},{id:"lineups",ar:"التشكيلة"},{id:"cups",ar:"البطولات"}];
}
function untilText(ms){
  var d=ms-Date.now();
  if(d<=0)return "بدأت";
  var h=Math.floor(d/3600000),mn=Math.floor(d%3600000/60000);
  if(h>=24){var dy=Math.floor(h/24);return dy===1?"بكرة":dy===2?"بعد يومين":"بعد "+dy+(dy<11?" أيام":" يوم")}
  if(h>0)return h===1?"بعد ساعة":h===2?"بعد ساعتين":"بعد "+h+" ساعات";
  return mn<=1?"الحين":mn===2?"بعد دقيقتين":"بعد "+mn+" دقيقة";
}
function tiles(arr){return '<div class="tiles">'+arr.map(function(t){
  var in_='<b>'+esc(t[0])+"</b><span>"+esc(t[1])+"</span>";
  if(t[3])return '<button class="tile'+(t[2]?" hi":"")+'" type="button" data-act="view" data-id="'+esc(t[3])+'">'+in_+"</button>";
  return '<div class="tile'+(t[2]?" hi":"")+'">'+in_+"</div>"}).join("")+"</div>"}

function linkedMe(){if(!S.uid)return null;for(var i=0;i<S.players.length;i++)if(S.players[i].userId===S.uid)return S.players[i];return null}
function me(){var l=linkedMe();if(l)return l;if(S.localId)return byId(S.players,S.localId);return null}
function canAct(){return canWriteData()&&!!linkedMe()}
function myClaim(){if(!S.uid)return null;for(var i=0;i<S.claims.length;i++)if(S.claims[i].userId===S.uid)return S.claims[i];return null}
function myRole(){var m=me();if(m&&m.role)return m.role;return S.adminLevel?"admin":null}
function reallyAdmin(){
  if(S.owner)return true;
  var l=linkedMe();
  return !!(l&&l.role==="admin");
}
function isAdmin(){return !S.asPlayer&&reallyAdmin()}
function isCap(){var l=linkedMe();return !!(l&&l.role==="captain")}
function isVice(){var l=linkedMe();return !!(l&&l.role==="vice")}
function canWriteData(){return S.canWrite!==false}
function canFormation(){return canWriteData()&&(isAdmin()||isCap())}
function canApprove(){return canWriteData()&&(isAdmin()||isCap())}
function canAddMatch(){return canWriteData()&&(isAdmin()||isCap())}
/* the vice arranges the lineup until the captain approves it; after that only
   the captain or the admin touches it — no more "last edit wins" */
function canLineup(mid){
  if(!canWriteData())return false;
  if(isAdmin()||isCap())return true;
  if(!isVice())return false;
  return !lineupOf(mid).locked;
}
function seesLineupTools(){return isAdmin()||isCap()||isVice()}

/* ---------- dates ---------- */
var DF=null;
function dfmt(iso,withTime){
  if(!iso)return "—";
  var d=new Date(iso);if(isNaN(d))return "—";
  try{
    return d.toLocaleString("ar-EG-u-nu-latn",withTime===false?{day:"numeric",month:"short",year:"numeric"}:{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  }catch(e){return d.toISOString().slice(0,16).replace("T"," ")}
}
function msOf(iso){var d=new Date(iso);return isNaN(d)?0:d.getTime()}
function deadline(m){return msOf(m.date)-3600000}
function remindAt(m){return msOf(m.date)-7200000}
function monthKey(iso){return String(iso||"").slice(0,7)}
function nowMonth(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}

/* ---------- attendance ---------- */
/* attendance lives in its own small documents: a player writes only his own,
   so confirming never rewrites the whole match (and two people confirming at
   once no longer overwrite each other) */
function attRec(m,pid){
  var byM=S.attIdx&&S.attIdx[m.id];
  if(byM&&byM[pid])return byM[pid];
  return (m.attendance||{})[pid]||null;   /* rows carried over from the old app */
}
function attOf(m,pid){
  var a=attRec(m,pid);
  var st=a&&a.status;
  if(st==="in"||st==="excused"||st==="absent")return st;
  if(Date.now()>deadline(m))return "absent";
  return "none";
}
function attCount(m,players){
  var c={in:0,excused:0,absent:0,none:0};
  players.forEach(function(p){c[attOf(m,p.id)]++});
  return c;
}
function clubPlayers(clubId){
  if(!clubId)return S.players.filter(function(p){return !p.clubId});
  return S.players.filter(function(p){return p.clubId===clubId});
}
/* roster of a match = its club's players + anyone already attached to it, so a
   player moved to another club later keeps his attendance, numbers and slot */
function rosterOf(m){
  if(!m)return [];
  var ps=clubPlayers(m.clubId),seen={},extra={},L=m.lineup||{};
  ps.forEach(function(p){seen[p.id]=1});
  Object.keys(m.attendance||{}).forEach(function(k){extra[k]=1});
  Object.keys((S.attIdx&&S.attIdx[m.id])||{}).forEach(function(k){extra[k]=1});
  Object.keys(m.stats||{}).forEach(function(k){extra[k]=1});
  (L.slots||[]).forEach(function(k){if(k)extra[k]=1});
  (L.bench||[]).forEach(function(k){if(k)extra[k]=1});
  Object.keys(extra).forEach(function(k){
    if(seen[k])return;
    var p=byId(S.players,k);if(p){seen[k]=1;ps.push(p)}
  });
  return ps;
}

/* ---------- scoring ---------- */
function normScoring(d){
  var o={global:{},cats:{}};
  var g=(d&&d.global)||{};
  ["win","draw","motm","red"].forEach(function(k){o.global[k]=g[k]==null?DEF_SCORING.global[k]:n(g[k])});
  CAT.forEach(function(c){
    var src=(d&&d.cats&&d.cats[c.id])||{},dst={};
    WKEYS.forEach(function(w){ if(src[w.k]!=null)dst[w.k]=n(src[w.k]); else if(DEF_SCORING.cats[c.id][w.k]!=null)dst[w.k]=DEF_SCORING.cats[c.id][w.k]; });
    o.cats[c.id]=dst;
  });
  return o;
}
function pointsFor(st,m,cat){
  var g=S.scoring.global,w=S.scoring.cats[cat]||{},p=0;
  var sf=n(m.scoreFor),sa=n(m.scoreAgainst);
  if(sf>sa)p+=n(g.win);else if(sf===sa)p+=n(g.draw);
  if(st.motm)p+=n(g.motm);
  if(st.red)p+=n(g.red);
  p+=n(w.goal)*n(st.goals)+n(w.assist)*n(st.assists)+n(w.shot)*n(st.shots)+n(w.tackle)*n(st.tackles)+n(w.save)*n(st.saves);
  p+=Math.floor(n(st.passes)/10)*n(w.pass10);
  if(sa===0)p+=n(w.cleanSheet);
  var conc=st.conceded==null?(cat==="GK"?sa:0):n(st.conceded);
  p+=n(w.conceded)*conc;
  return p;
}
function aggregate(opt){
  var period=opt.period,scope=opt.scope,out={},mk=nowMonth();
  S.matches.forEach(function(m){
    if(m.status!=="played")return;
    if(period==="month"&&monthKey(m.date)!==mk)return;
    if(S.cfg.seasonStart&&m.date<S.cfg.seasonStart)return;
    if(scope&&scope!=="all"&&m.clubId!==scope)return;
    var stats=m.stats||{};
    Object.keys(stats).forEach(function(pid){
      var st=stats[pid];if(!st||!st.played)return;
      var pl=byId(S.players,pid);
      var cat=st.cat||(pl?catOf(pl.pos):"CM");
      var t=out[pid];
      if(!t)t=out[pid]={pid:pid,cat:cat,matches:0,goals:0,assists:0,shots:0,tackles:0,passes:0,saves:0,conceded:0,cleanSheets:0,motm:0,red:0,points:0};
      t.cat=cat;t.matches++;
      t.goals+=n(st.goals);t.assists+=n(st.assists);t.shots+=n(st.shots);t.tackles+=n(st.tackles);
      t.passes+=n(st.passes);t.saves+=n(st.saves);
      t.conceded+=st.conceded==null?(cat==="GK"?n(m.scoreAgainst):0):n(st.conceded);
      if(n(m.scoreAgainst)===0)t.cleanSheets++;
      if(st.motm)t.motm++;
      if(st.red)t.red++;
      t.points+=pointsFor(st,m,cat);
    });
  });
  return out;
}
function sortBoard(rows,mode,catId){
  var prim=mode==="goals"?"goals":mode==="assists"?"assists":catOb(catId).key;
  var second=mode==="goals"?"assists":mode==="assists"?"goals":prim;
  return rows.sort(function(a,b){
    var av=mode==="points"?a.points:a[prim],bv=mode==="points"?b.points:b[prim];
    if(bv!==av)return bv-av;
    if(a.matches!==b.matches)return a.matches-b.matches;
    if(b[second]!==a[second])return b[second]-a[second];
    return String(nameOf(a.pid)).localeCompare(String(nameOf(b.pid)),"ar");
  });
}

/* square, shrunk and re-encoded in the browser so a 6 MB phone photo
   does not land in the artifact's storage */
function shrinkImage(file,max){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      try{
        var w=im.naturalWidth,h=im.naturalHeight;
        if(!w||!h){URL.revokeObjectURL(url);rej({code:"decode"});return}
        var side=Math.min(w,h),out=Math.min(max,side);
        var cv=document.createElement("canvas");cv.width=out;cv.height=out;
        var g=cv.getContext("2d");
        g.fillStyle="#121922";g.fillRect(0,0,out,out);
        g.drawImage(im,(w-side)/2,(h-side)/2,side,side,0,0,out,out);
        URL.revokeObjectURL(url);
        cv.toBlob(function(b){b?res(b):rej({code:"encode"})},"image/webp",0.86);
      }catch(e){URL.revokeObjectURL(url);rej(e)}
    };
    im.onerror=function(){URL.revokeObjectURL(url);rej({code:"decode"})};
    im.src=url;
  });
}
function uploadPhoto(pl,file){
  if(!S.assets){toast("رفع الصور للإدارة والكابتن");return}
  if(!/^image\//.test(file.type||"")){toast("اختر صورة");return}
  toast("جاري رفع الصورة…");
  shrinkImage(file,320).then(function(blob){
    return S.assets.upload(blob);
  }).then(function(r){
    var cur=byId(S.players,pl.id)||pl,old=cur.photo||"";
    var b={};for(var k in cur)if(k!=="id")b[k]=cur[k];
    b.photo=r.id;
    return save("players/"+pl.id,b).then(function(){
      toast("انحفظت الصورة");
      if(old&&old!==r.id&&S.assets.delete){try{S.assets.delete(old)}catch(e){}}
      /* redraw from what we just wrote: the snapshot may not be back yet */
      var shown={};for(var k2 in b)shown[k2]=b[k2];shown.id=pl.id;
      sheetPlayer(shown);
    });
  }).catch(function(e){
    var c=e&&e.code;
    toast(c==="not_granted"?"ما عندك صلاحية رفع صور":
      c==="unsupported_type"?"نوع الصورة مو مدعوم":
      c==="quota_exceeded"?"مساحة التخزين امتلت":"ما انرفعت الصورة");
  });
}

/* ---------- absences ---------- */
/* a player is never counted absent from a match that passed before he joined */
function eligible(p,m){
  if(!p||!p.createdAt)return true;
  var d=msOf(m.date);
  return !d||msOf(p.createdAt)<=d;
}
var ABSC=null;
function absences(){
  if(ABSC)return ABSC;
  var out={};
  S.matches.forEach(function(m){
    if(Date.now()<deadline(m))return;
    rosterOf(m).forEach(function(p){
      if(!eligible(p,m))return;
      if(attOf(m,p.id)==="absent")out[p.id]=(out[p.id]||0)+1;
    });
  });
  ABSC=out;return out;
}
function escLevel(c){return c>=5?{ar:"وصل للإدارة",cls:"bad"}:c>=4?{ar:"وصل للكابتن",cls:"bad"}:c>=3?{ar:"تنبيه",cls:"mid"}:null}

/* ---------- titles from cups ---------- */
function titlesOf(pid){
  var t=[];
  S.cups.forEach(function(c){
    var a=c.awards||{};
    if(a.scorer===pid)t.push("هداف "+(c.name||"بطولة"));
    if(a.best===pid)t.push("أفضل لاعب في "+(c.name||"بطولة"));
  });
  var p=byId(S.players,pid);
  if(p&&Array.isArray(p.titles))t=t.concat(p.titles);
  return t;
}

/* ---------- db plumbing ---------- */
var timer=null;
function markGot(k,snap){
  S.got[k]=true;
  if(snap&&snap.metadata&&snap.metadata.fromCache===false&&timer){clearTimeout(timer);timer=null;S.slow=false}
}
function dbErr(k){return function(e){
  S.got[k]=true;
  if(e&&(e.code==="revoked"||e.code==="not_granted"))S.offline=true;
  if(timer){clearTimeout(timer);timer=null}
  S.slow=false;render();
}}
function subscribe(){
  timer=setTimeout(function(){S.slow=true;render()},10000);
  S.db.doc("config/scoring").onSnapshot(function(s){S.scoring=normScoring(s.exists?s.data():null);markGot("scoring",s);render()},dbErr("scoring"));
  S.db.doc("config/app").onSnapshot(function(s){
    var d=s.exists?s.data():{};
    S.cfg={minMatches:d.minMatches==null?5:n(d.minMatches),seasonStart:d.seasonStart||""};
    markGot("cfg",s);render();
  },dbErr("cfg"));
  S.db.collection("attendance").onSnapshot(function(q){
    var idx={};
    q.docs.forEach(function(d){
      var v=d.data()||{};
      if(!v.matchId||!v.playerId)return;
      (idx[v.matchId]||(idx[v.matchId]={}))[v.playerId]=v;
    });
    S.attIdx=idx;markGot("attendance",q);render();
  },dbErr("attendance"));
  ["clubs","players","matches","cups","posts","requests","claims"].forEach(function(c){
    S.db.collection(c).onSnapshot(function(q){
      S[c]=q.docs.map(function(d){var src=d.data()||{},o={};for(var k in src)o[k]=src[k];o.id=d.id;return o});
      if(c==="matches")S.matches.sort(function(a,b){return msOf(a.date)-msOf(b.date)});
      if(c==="players")S.players.sort(function(a,b){return String(a.name||"").localeCompare(String(b.name||""),"ar")});
      markGot(c,q);render();
    },dbErr(c));
  });
}
function clean(v){
  if(v===undefined||v===null)return null;
  if(Array.isArray(v)){var a=[];for(var i=0;i<v.length;i++)a.push(clean(v[i]));return a}
  if(typeof v==="object"){var o={};for(var k in v)if(Object.prototype.hasOwnProperty.call(v,k)&&v[k]!==undefined)o[k]=clean(v[k]);return o}
  return v;
}
function save(path,data){
  return S.db.doc(path).set(clean(data)).then(function(){return true}).catch(function(e){
    /* the server decides each write on its own path, so a refusal here says
       nothing about the rest of the screen — don't switch the app to read-only */
    toast(e&&e.code==="invalid_argument"?(S.uid?"ما انحفظ — ما عندك صلاحية على هذا":"ما انحفظ — سجّل دخولك أول"):"ما انحفظ، جرّب مرة ثانية");
    throw e;
  });
}

function clanPeek(){

  var up=S.matches.filter(function(x){return x.status!=="played"&&msOf(x.date)>=now-3600000})
    .sort(function(a,b){return msOf(a.date)-msOf(b.date)});

    var c=attCount(nx,rosterOf(nx));
    out+='<div class="card"><div class="card-h"><h3>المباراة الجاية</h3>'+
      '<div class="end"><button class="btn sm" type="button" data-act="view" data-id="matches">كل المباريات</button></div></div>'+
      '<div class="pad grid" style="gap:12px"><div class="next">'+
      '<div class="k">'+esc(clubName(nx.clubId))+" × "+esc(nx.opponent||"خصم")+"<small>"+esc(dfmt(nx.date))+"</small></div>"+
      '<div class="cd">'+esc(untilText(msOf(nx.date)))+"</div></div>"+
      '<div class="att"><span class="chip good">'+c["in"]+' مؤكد</span><span class="chip mid">'+c.excused+" بعذر</span></div></div></div>";
  }
  var agg=aggregate({period:"season",scope:"all"}),rows=[];
  Object.keys(agg).forEach(function(p){rows.push(agg[p])});

  rows=rows.filter(function(t){return t.goals>0}).slice(0,3);
  if(rows.length){
    out+='<div class="card"><div class="card-h"><h3>الهدافين</h3>'+
      '<div class="end"><button class="btn sm" type="button" data-act="view" data-id="leaders">الصدارة كاملة</button></div></div>'+
      '<div class="tbox"><table><tbody>'+rows.map(function(t,i){
        return '<tr class="p'+(i+1)+'"><td class="rank num"><span class="med">'+(i+1)+"</span></td>"+
          '<td class="who"><b>'+esc(nameOf(t.pid))+"</b><span>"+esc(clubName((byId(S.players,t.pid)||{}).clubId))+"</span></td>"+
          '<td class="num pts">'+t.goals+'</td><td class="num">هدف</td></tr>'}).join("")+"</tbody></table></div></div>";
  }
  var ps=postsFor(null).slice(0,2);
  if(ps.length){
    out+='<div class="card"><div class="card-h"><h3>الإعلانات</h3></div>'+ps.map(function(x){
      return '<div class="todo"><div class="t"><b>'+esc(x.title||"إعلان")+"</b><span>"+esc(x.body||"")+"</span></div>"+
        '<span class="end"><span class="chip">'+esc(dfmt(x.at,false))+"</span></span></div>"}).join("")+"</div>";
  }
  return out;
}

/* ---------- points over the last matches ----------
   one series, so the heading names it and no legend is needed; polarity reads
   from the baseline (above it = positive), never from colour alone */
function sparkPoints(pid){
  var rows=[],i;
  S.matches.forEach(function(m){
    if(m.status!=="played")return;
    var st=(m.stats||{})[pid];if(!st||!st.played)return;
    var cat=st.cat||catOf((byId(S.players,pid)||{}).pos);
    rows.push({p:pointsFor(st,m,cat),o:m.opponent||"خصم",d:m.date,t:msOf(m.date)});
  });
  rows.sort(function(a,b){return a.t-b.t});
  rows=rows.slice(-12);
  if(!rows.length)return '<p class="note">ما فيه مباريات مسجلة لك بعد. أول نتيجة تتسجل ويبان الرسم.</p>';
  var W=320,H=104,pt=16,pb=24,hi=0,lo=0;
  for(i=0;i<rows.length;i++){if(rows[i].p>hi)hi=rows[i].p;if(rows[i].p<lo)lo=rows[i].p}
  if(hi===lo)hi=lo+1;
  var span=hi-lo,ih=H-pt-pb,bw=W/rows.length,zy=pt+(hi/span)*ih;
  var best=0,sum=0;
  for(i=0;i<rows.length;i++){sum+=rows[i].p;if(rows[i].p>rows[best].p)best=i}
  var bars="",labs="";
  for(i=0;i<rows.length;i++){
    var r=rows[i],w=Math.min(Math.max(bw-4,3),30),x=i*bw+(bw-w)/2;
    var y=pt+((hi-r.p)/span)*ih,up=r.p>=0;
    var top=up?y:zy,h=up?(zy-y):(y-zy);
    if(h<2){h=2;top=up?zy-2:zy}
    bars+='<rect x="'+x.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+
      '" rx="3" fill="'+(up?"var(--accent)":"var(--bad)")+'"><title>'+esc(r.o+" · "+fmt(r.p)+" نقطة · "+dfmt(r.d,false))+"</title></rect>";
    if(i===best||i===rows.length-1||r.p<0)
      labs+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(up?(top-5).toFixed(1):(top+h+13).toFixed(1))+
        '" text-anchor="middle" font-size="10" font-family="Readex Pro,sans-serif" fill="currentColor" opacity=".7">'+esc(fmt(r.p))+"</text>";
  }
  return '<div style="direction:ltr;color:var(--fg-dim)"><svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="'+
    esc("نقاطك في آخر "+rows.length+" مباريات، أعلاها "+fmt(hi)+" وأقلها "+fmt(lo))+
    '" style="display:block;width:100%;height:auto;overflow:visible">'+
    '<line x1="0" x2="'+W+'" y1="'+zy.toFixed(1)+'" y2="'+zy.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>'+
    bars+labs+"</svg></div>"+
    '<div class="row" style="margin-top:10px"><span class="chip">آخر '+rows.length+' مباريات</span>'+
    '<span class="chip gold">أعلى '+fmt(hi)+'</span><span class="chip">المعدل '+fmt(sum/rows.length)+"</span>"+
    (lo<0?'<span class="chip bad">أقل <span style="direction:ltr;unicode-bidi:isolate">'+fmt(lo)+"</span></span>":"")+"</div>";
}

/* ---------- view: leaders ---------- */
function vLeaders(){
  if(!loading())return '<div class="card">'+emptyBox("جاري التحميل","لحظة.")+"</div>";
  if(!S.players.length)return '<div class="card">'+emptyBox("ما فيه لاعبين بعد","ضيف اللاعبين من قسم الإدارة، وبعدها الصدارة تنبني لحالها من إحصائيات المباريات.",'<button class="btn pri" type="button" data-act="view" data-id="clan">افتح الإدارة</button>')+"</div>";
  var u=S.ui,agg=aggregate({period:u.period,scope:u.scope});
  var mode=u.cat==="goals"?"goals":u.cat==="assists"?"assists":"points";
  var rows=[],low=[];
  Object.keys(agg).forEach(function(pid){
    var t=agg[pid];
    if(mode==="points"&&t.cat!==u.cat)return;
    (t.matches>=n(S.cfg.minMatches)?rows:low).push(t);
  });
  sortBoard(rows,mode,u.cat);sortBoard(low,mode,u.cat);
  var c=catOb(u.cat),mine=me();
  var head,cells;
  if(mode==="goals"){head=['<th class="num">مباريات</th>','<th class="num">أهداف</th>','<th class="num">أسيست</th>','<th class="num">نقاط</th>'];
    cells=function(t){return '<td class="num">'+t.matches+'</td><td class="num pts">'+t.goals+'</td><td class="num">'+t.assists+'</td><td class="num">'+fmt(t.points)+"</td>"}}
  else if(mode==="assists"){head=['<th class="num">مباريات</th>','<th class="num">أسيست</th>','<th class="num">أهداف</th>','<th class="num">نقاط</th>'];
    cells=function(t){return '<td class="num">'+t.matches+'</td><td class="num pts">'+t.assists+'</td><td class="num">'+t.goals+'</td><td class="num">'+fmt(t.points)+"</td>"}}
  else{head=['<th class="num">مباريات</th>','<th class="num">نقاط</th>','<th class="num">'+esc(c.keyAr)+'</th>','<th class="num">أهداف</th>','<th class="num">أسيست</th>'];
    cells=function(t){return '<td class="num">'+t.matches+'</td><td class="num pts">'+fmt(t.points)+'</td><td class="num">'+fmt(t[c.key])+'</td><td class="num">'+t.goals+'</td><td class="num">'+t.assists+"</td>"}}
  function body(list,off){
    return list.map(function(t,i){
      var p=byId(S.players,t.pid);
      var pc=off?"":(i===0?"p1 ":i===1?"p2 ":i===2?"p3 ":"");
      return '<tr class="'+pc+(mine&&mine.id===t.pid?"me":"")+'">'+
        '<td class="rank num">'+(off?"—":(i<3?'<span class="med">'+(i+1)+"</span>":i+1))+"</td>"+
        '<td class="who">'+whoCell(p,nameOf(t.pid),p?((p.gamertag||"")+(p.gamertag&&p.clubId?" · ":"")+(p.clubId?clubName(p.clubId):"")):"")+"</td>"+
        cells(t)+(off?'<td class="num"><span class="chip">باقي '+(n(S.cfg.minMatches)-t.matches)+"</span></td>":"")+"</tr>";
    }).join("");
  }
  var tabs='<div class="seg">'+
    '<button type="button" data-act="cat" data-id="goals" aria-pressed="'+(u.cat==="goals")+'">الهدافين</button>'+
    '<button type="button" data-act="cat" data-id="assists" aria-pressed="'+(u.cat==="assists")+'">الصناع</button></div>'+
    '<div class="seg">'+CAT.map(function(x){return '<button type="button" data-act="cat" data-id="'+x.id+'" aria-pressed="'+(u.cat===x.id)+'">'+esc(x.ar)+"</button>"}).join("")+"</div>";
  return '<div class="card"><div class="card-h"><h2>صدارة اللاعبين</h2>'+
    '<span class="sub">'+(mode==="points"?"بمجموع نقاط الأداء":"بالعدد")+' · الحد الأدنى '+n(S.cfg.minMatches)+' مباريات</span>'+
    '<div class="end"><div class="seg"><button type="button" data-act="period" data-id="month" aria-pressed="'+(u.period==="month")+'">شهري</button>'+
    '<button type="button" data-act="period" data-id="season" aria-pressed="'+(u.period==="season")+'">موسمي</button></div>'+
    '<select id="scopeSel" data-act="scope" style="width:auto">'+clubOpts(u.scope,"كل الأندية")+"</select>"+
    (S.dl?'<button class="btn sm" type="button" data-act="csv-leaders">صدّر CSV</button>':"")+"</div></div>"+
    '<div class="pad row" style="gap:8px">'+tabs+"</div>"+
    (rows.length?'<div class="tbox"><table><thead><tr><th class="rank">#</th><th>اللاعب</th>'+head.join("")+"</tr></thead><tbody>"+body(rows)+"</tbody></table></div>":
      emptyBox("ما فيه أحد في هذي الصدارة","سجّل نتائج مباريات وإحصائيات اللاعبين، والترتيب يطلع تلقائياً."))+
    (low.length?'<div class="pad"><div class="sec-title" style="margin-bottom:8px">تحت الحد الأدنى</div><div class="tbox"><table><thead><tr><th class="rank">#</th><th>اللاعب</th>'+head.join("")+'<th class="num">ناقص</th></tr></thead><tbody>'+body(low,true)+"</tbody></table></div></div>":"")+
    "</div>";
}

function exportLeaders(){
  if(!S.dl){toast("التصدير غير متاح هنا");return}
  var u=S.ui,agg=aggregate({period:u.period,scope:u.scope});
  var mode=u.cat==="goals"?"goals":u.cat==="assists"?"assists":"points",rows=[];
  Object.keys(agg).forEach(function(pid){var t=agg[pid];if(mode==="points"&&t.cat!==u.cat)return;rows.push(t)});
  if(!rows.length){toast("ما فيه صفوف تنصدّر");return}
  sortBoard(rows,mode,u.cat);
  var lines=[["#","اللاعب","اليوزر","النادي","المركز","مباريات","أهداف","أسيست","تسديدات","تدخلات","تمريرات","تصديات","كلين شيت","رجل المباراة","نقاط","مؤهل"]];
  rows.forEach(function(t,i){
    var p=byId(S.players,t.pid)||{};
    lines.push([i+1,nameOf(t.pid),p.gamertag||"",p.clubId?clubName(p.clubId):"",catOb(t.cat).ar,
      t.matches,t.goals,t.assists,t.shots,t.tackles,t.passes,t.saves,t.cleanSheets,t.motm,fmt(t.points),
      t.matches>=n(S.cfg.minMatches)?"نعم":"لا"]);
  });
  var csv=lines.map(function(r){return r.map(function(x){
    var v=String(x==null?"":x);
    return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
  }).join(";")}).join("\r\n");
  var nm="nyxon-"+(mode==="points"?u.cat:mode)+"-"+(u.period==="month"?nowMonth():"season")+".csv";
  try{
    var blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
    S.dl.save({filename:nm,data:blob}).then(function(){toast("انحفظ الملف")},
      function(e){toast(e&&e.code==="declined"?"ألغيت":"ما انحفظ الملف")});
  }catch(e){toast("ما انبنى الملف")}
}

/* ---------- view: matches ---------- */
function vMatches(){
  if(!loading())return '<div class="card">'+emptyBox("جاري التحميل","لحظة.")+"</div>";
  var up=[],past=[],now=Date.now();
  S.matches.forEach(function(m){ (m.status==="played"?past:up).push(m) });
  up.sort(function(a,b){return msOf(a.date)-msOf(b.date)});
  past.sort(function(a,b){return msOf(b.date)-msOf(a.date)});
  var shown=S.ui.allPast?past:past.slice(0,12);
  var add=canAddMatch()?'<button class="btn pri" type="button" data-act="new-match">نزّل مباراة</button>':"";
  var abs=absences(),absRows=Object.keys(abs).filter(function(p){return abs[p]>=3}).sort(function(a,b){return abs[b]-abs[a]});
  var out="";
  out+='<div class="card"><div class="card-h"><h2>المباريات القادمة</h2><span class="sub">تأكيد الحضور يُقفل قبل المباراة بساعة</span><div class="end">'+add+"</div></div>"+
    (up.length?up.map(mrow).join(""):emptyBox("ما فيه مباريات منزّلة","الكابتن ينزّل المباريات الخارجية، والإدارة تنزّل الداخلية.",add))+"</div>";
  if(absRows.length){
    out+='<div class="card"><div class="card-h"><h3>الغياب بدون عذر</h3><span class="sub">3 تنبيه · 4 للكابتن · 5 للإدارة</span></div><div class="tbox"><table><tbody>'+
      absRows.map(function(pid){var L=escLevel(abs[pid]);var p=byId(S.players,pid);
        return "<tr><td class=\"who\"><b>"+esc(nameOf(pid))+"</b><span>"+esc(p&&p.clubId?clubName(p.clubId):"")+'</span></td><td class="num">'+abs[pid]+' غياب</td><td><span class="chip '+L.cls+'">'+esc(L.ar)+"</span></td></tr>"}).join("")+
      "</tbody></table></div></div>";
  }
  out+='<div class="card"><div class="card-h"><h2>مباريات منتهية</h2>'+(past.length>12?'<div class="end"><button class="btn sm" type="button" data-act="all-past">'+(S.ui.allPast?"اعرض آخر 12":"اعرض الكل ("+past.length+")")+"</button></div>":"")+"</div>"+
    (past.length?shown.map(mrow).join(""):emptyBox("ما فيه نتائج مسجلة","بعد كل مباراة سجّل النتيجة وأرقام اللاعبين، والصدارة تتحدث تلقائياً."))+"</div>";
  return out;
}
function mrow(m){
  var played=m.status==="played",now=Date.now(),mine=me();
  var ps=rosterOf(m),c=attCount(m,ps);
  var res=played?(n(m.scoreFor)>n(m.scoreAgainst)?{ar:"فوز",cls:"good"}:n(m.scoreFor)===n(m.scoreAgainst)?{ar:"تعادل",cls:"mid"}:{ar:"خسارة",cls:"bad"}):null;
  var open=now<deadline(m),soon=!played&&now>=remindAt(m)&&open;
  var myAtt=mine?attOf(m,mine.id):null;
  var acts="";
  if(!played){
    if(mine&&canWriteData()&&open){
      acts+='<button class="btn sm'+(myAtt==="in"?" pri":"")+'" type="button" data-act="att" data-id="'+m.id+'" data-v="in">حاضر</button>'+
            '<button class="btn sm'+(myAtt==="excused"?" pri":"")+'" type="button" data-act="att" data-id="'+m.id+'" data-v="excused">غياب بعذر</button>';
    }
    if(canAddMatch())acts+='<button class="btn sm" type="button" data-act="att-manage" data-id="'+m.id+'">الحضور</button>'+
      '<button class="btn sm pri" type="button" data-act="result" data-id="'+m.id+'">سجّل النتيجة</button>'+
      '<button class="btn sm" type="button" data-act="edit-match" data-id="'+m.id+'">تعديل</button>';
    if(seesLineupTools())acts+='<button class="btn sm" type="button" data-act="goto-lineup" data-id="'+m.id+'">التشكيلة</button>';
  }else{
    acts+='<button class="btn sm" type="button" data-act="stats-view" data-id="'+m.id+'">الإحصائيات</button>';
    if(canAddMatch())acts+='<button class="btn sm" type="button" data-act="result" data-id="'+m.id+'">تعديل النتيجة</button>';
  }
  var motm="";
  if(played){var st=m.stats||{};for(var k in st)if(st[k]&&st[k].motm){motm=nameOf(k);break}}
  return '<div class="mrow"><span class="when">'+esc(dfmt(m.date))+"</span>"+
    '<span class="vs">'+esc(clubName(m.clubId))+" × "+esc(m.opponent||"خصم")+
      "<small>"+(m.type==="internal"?"مباراة داخلية":"مباراة خارجية")+(m.cupId&&byId(S.cups,m.cupId)?" · "+esc(byId(S.cups,m.cupId).name):"")+"</small></span>"+
    (played?'<span class="score">'+n(m.scoreFor)+" - "+n(m.scoreAgainst)+'</span><span class="chip '+res.cls+'">'+res.ar+"</span>"+(motm?'<span class="chip gold">رجل المباراة: '+esc(motm)+"</span>":""):
      '<span class="att"><span class="chip good">'+c["in"]+' مؤكد</span><span class="chip mid">'+c.excused+' بعذر</span><span class="chip'+(c.absent?" bad":"")+'">'+(open?c.none+" ما رد":c.absent+" غياب")+"</span>"+
      (soon?'<span class="chip gold">المباراة قريبة — ذكّر اللاعبين</span>':"")+(open?"":'<span class="chip">أُقفل التأكيد</span>')+"</span>")+
    '<span class="acts">'+acts+"</span></div>";
}

/* ---------- view: lineups ---------- */
function vLineups(){
  if(!loading())return '<div class="card">'+emptyBox("جاري التحميل","لحظة.")+"</div>";
  var up=S.matches.filter(function(m){return m.status!=="played"}).sort(function(a,b){return msOf(a.date)-msOf(b.date)});
  var all=up.concat(S.matches.filter(function(m){return m.status==="played"}).sort(function(a,b){return msOf(b.date)-msOf(a.date)}).slice(0,8));
  if(!all.length)return '<div class="card">'+emptyBox("ما فيه مباراة","نزّل مباراة أول، وبعدها تبني تشكيلتها.",'<button class="btn pri" type="button" data-act="view" data-id="matches">افتح المباريات</button>')+"</div>";
  var mid=S.ui.lineupMatch&&byId(S.matches,S.ui.lineupMatch)?S.ui.lineupMatch:all[0].id;
  S.ui.lineupMatch=mid;
  var m=byId(S.matches,mid),L=m.lineup||{formation:"4-3-3",slots:[],bench:[]};
  var form=FORMS[L.formation]?L.formation:"4-3-3";
  var slots=FORMS[form],sel=slotsArr(L);
  var edit=canLineup(mid),locked=!!L.locked;
  var pitch=slots.map(function(s,i){
    var pid=sel[i],p=pid?byId(S.players,pid):null;
    return '<button class="slot'+(p?" on":"")+'" type="button" style="left:'+s[1]+"%;top:"+s[2]+'%" data-act="slot" data-id="'+i+'"'+(edit?"":" disabled")+'>'+
      '<span class="dot">'+(p&&p.photo?'<img src="'+esc(photoUrl(p))+'" alt="">':esc(s[0]))+
      '</span><span class="nm">'+esc(p?p.name:"فاضي")+"</span></button>";
  }).join("");
  var bench=(L.bench||[]).map(function(pid){
    return '<span class="chip">'+esc(nameOf(pid))+(edit?' <button class="btn sm" type="button" data-act="bench-del" data-id="'+esc(pid)+'" style="padding:0 4px;border:0;background:none;color:inherit">&times;</button>':"")+"</span>";
  }).join("");
  var cnt=attCount(m,rosterOf(m)),filled=sel.filter(Boolean).length;
  var who=L.by?nameOf(L.by):"";
  var statusRow='<div class="spread" style="gap:8px"><span class="chip'+(locked?" good":" mid")+'">'+
    (locked?"معتمدة من الكابتن":"مسودة — ما انعتمدت")+'</span><span class="chip">'+filled+"/"+slots.length+" مركز</span>"+
    (who?'<span class="chip">آخر تعديل: '+esc(who)+" · "+esc(dfmt(L.at))+"</span>":"")+
    '<span class="end">'+
      (canApprove()&&!locked?'<button class="btn sm pri" type="button" data-act="lineup-approve">اعتمد التشكيلة</button>':"")+
      (canApprove()&&locked?'<button class="btn sm" type="button" data-act="lineup-unlock">افتح التعديل</button>':"")+
    "</span></div>";
  var hint=locked?
    (canApprove()?'<p class="note">معتمدة — نائب الكابتن ما يعدلها لين تفتح التعديل.</p>':
      '<div class="warnbox"><b>معتمدة من الكابتن.</b> ما تنعدل. كلّم الكابتن إذا تبي تغيير.</div>'):
    (isVice()&&!isCap()&&!isAdmin()?'<p class="note">ترتبها كمسودة والكابتن يعتمدها. الخطة يحددها الكابتن.</p>':"");
  return '<div class="card"><div class="card-h"><h2>التشكيلة</h2><span class="sub">'+esc(clubName(m.clubId))+" × "+esc(m.opponent||"خصم")+" · "+esc(dfmt(m.date))+"</span>"+
    '<div class="end"><select data-act="pick-match" style="width:auto">'+all.map(function(x){
      return '<option value="'+x.id+'"'+(x.id===mid?" selected":"")+">"+esc(dfmt(x.date,false)+" — "+(x.opponent||"خصم"))+"</option>"}).join("")+"</select></div></div>"+
    '<div class="pad grid" style="gap:16px">'+statusRow+hint+
      '<div class="spread"><div><label for="formSel">الخطة</label><select id="formSel" data-act="formation" style="width:auto"'+(canFormation()?"":" disabled")+">"+
        Object.keys(FORMS).map(function(f){return '<option value="'+f+'"'+(f===form?" selected":"")+">"+f+"</option>"}).join("")+"</select>"+
        (canFormation()?"":'<div class="note" style="margin-top:4px">الخطة يحددها الكابتن</div>')+"</div>"+
      '<div class="end"><label class="tick"><input type="checkbox" id="confOnly" data-act="conf-only"'+(S.ui.confirmedOnly?" checked":"")+'> المؤكدين فقط ('+cnt["in"]+")</label>"+
        (S.dl?'<button class="btn" type="button" data-act="export-lineup">صدّر صورة</button>':"")+
        (edit?'<button class="btn" type="button" data-act="clear-lineup">تفريغ</button>':"")+"</div></div>"+
      '<div class="pitch"><i class="mid"></i><i class="circ"></i><i class="box"></i><i class="box2"></i>'+pitch+"</div>"+
      '<div><div class="sec-title" style="margin-bottom:8px">الاحتياط</div><div class="row">'+(bench||'<span class="note">ما فيه احتياط.</span>')+
        (edit?' <button class="btn sm" type="button" data-act="bench-add">+ أضف</button>':"")+"</div></div>"+
      (edit?"":'<p class="note">التشكيلة يبنيها الكابتن ونائبه، والكابتن يعتمدها.</p>')+
    "</div></div>";
}

/* ---------- view: cups ---------- */
function vCups(){
  if(!S.got.cups)return '<div class="card">'+emptyBox("جاري التحميل","لحظة.")+"</div>";
  var add=isAdmin()&&canWriteData()?'<button class="btn pri" type="button" data-act="new-cup">بطولة جديدة</button>':"";
  if(!S.cups.length)return '<div class="card"><div class="card-h"><h2>البطولات والدوريات</h2><div class="end">'+add+"</div></div>"+
    emptyBox("ما فيه بطولات","الإدارة تحدد نظام كل بطولة وتحط جدولها وفرقها بيدها.",add)+"</div>";
  return S.cups.map(cupCard).join("")+'<div class="card"><div class="pad row"><span class="note">تبي بطولة ثانية؟</span><span class="end">'+add+"</span></div></div>";
}
function cupCard(c){
  var fx=c.fixtures||[],teams=c.teams||[],fmtAr=c.format==="ko"?"خروج مغلوب":c.format==="groups"?"مجموعات ثم إقصائيات":"دوري";
  var adm=isAdmin()&&canWriteData();
  var tbl="";
  if(c.format!=="ko"&&teams.length){
    var st={};teams.forEach(function(t){st[t]={t:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}});
    fx.forEach(function(f){
      if(f.sa==null||f.sb==null||f.sa===""||f.sb===""||!st[f.a]||!st[f.b])return;
      var a=st[f.a],b=st[f.b],x=n(f.sa),y=n(f.sb);
      a.p++;b.p++;a.gf+=x;a.ga+=y;b.gf+=y;b.ga+=x;
      if(x>y){a.w++;b.l++;a.pts+=3}else if(x<y){b.w++;a.l++;b.pts+=3}else{a.d++;b.d++;a.pts++;b.pts++}
    });
    var rows=teams.map(function(t){return st[t]}).sort(function(a,b){
      if(b.pts!==a.pts)return b.pts-a.pts;
      if((b.gf-b.ga)!==(a.gf-a.ga))return (b.gf-b.ga)-(a.gf-a.ga);
      if(b.gf!==a.gf)return b.gf-a.gf;
      return String(a.t).localeCompare(String(b.t),"ar");
    });
    tbl='<div class="tbox"><table><thead><tr><th class="rank">#</th><th>الفريق</th><th class="num">لعب</th><th class="num">ف</th><th class="num">ت</th><th class="num">خ</th><th class="num">له</th><th class="num">عليه</th><th class="num">+/-</th><th class="num">نقاط</th></tr></thead><tbody>'+
      rows.map(function(r,i){return '<tr class="'+(i===0?"p1":"")+'"><td class="rank num">'+(i+1)+'</td><td class="who"><b>'+esc(r.t)+'</b></td><td class="num">'+r.p+'</td><td class="num">'+r.w+'</td><td class="num">'+r.d+'</td><td class="num">'+r.l+'</td><td class="num">'+r.gf+'</td><td class="num">'+r.ga+'</td><td class="num">'+(r.gf-r.ga>0?"+":"")+(r.gf-r.ga)+'</td><td class="num pts">'+r.pts+"</td></tr>"}).join("")+
      "</tbody></table></div>";
  }
  var fxList=fx.length?'<div class="tbox"><table><tbody>'+fx.map(function(f,i){
    return "<tr><td>"+esc(f.round||"")+'</td><td class="who"><b>'+esc(f.a||"—")+" × "+esc(f.b||"—")+"</b><span>"+esc(f.date?dfmt(f.date):"بدون موعد")+'</span></td><td class="num pts">'+
      (f.sa==null||f.sa===""?"—":n(f.sa)+" - "+n(f.sb))+"</td>"+(adm?'<td><button class="btn sm" type="button" data-act="fx-edit" data-id="'+c.id+'" data-v="'+i+'">تعديل</button></td>':"")+"</tr>"}).join("")+"</tbody></table></div>":
    '<div class="note" style="padding:0 16px 14px">ما فيه مباريات في الجدول. الجدول ينحط يدوياً.</div>';
  var a=c.awards||{};
  var aw=(a.champion||a.scorer||a.best)?'<div class="row" style="padding:0 16px 14px">'+
    (a.champion?'<span class="chip gold">البطل: '+esc(a.champion)+"</span>":"")+
    (a.scorer?'<span class="chip gold">الهداف: '+esc(nameOf(a.scorer))+"</span>":"")+

function parseBulk(){
  var txt=val("blText"),dc=val("blClub"),dp=val("blPos"),out=[],seen={};
  var pmap={};POS.forEach(function(p){pmap[p.ar]=p.id;pmap[p.id.toLowerCase()]=p.id});
  var rmap={"إدارة":"admin","ادارة":"admin","كابتن":"captain","نائب":"vice","نائب كابتن":"vice","لاعب":"player",
    "admin":"admin","captain":"captain","vice":"vice","player":"player"};
  S.players.forEach(function(p){seen[String(p.name||"").trim()]=1});
  txt.split("\n").forEach(function(line){
    var raw=line.trim();if(!raw)return;
    var f=raw.split(/[\t,،|]/).map(function(x){return x.trim()});
    var r={name:f[0]||"",gamertag:f[1]||"",pos:dp,clubId:dc,role:"player",err:""};
    if(!r.name)r.err="بدون اسم";
    if(!r.err&&f[2]){var pv=pmap[f[2]]||pmap[f[2].toLowerCase()];if(pv)r.pos=pv;else r.err="مركز غير معروف: "+f[2]}
    if(!r.err&&f[3]){var cl=null;S.clubs.forEach(function(c){if(String(c.name||"").toLowerCase()===f[3].toLowerCase())cl=c});
      if(cl)r.clubId=cl.id;else r.err="نادي غير معروف: "+f[3]}
    if(!r.err&&f[4]){var rv=rmap[f[4]]||rmap[f[4].toLowerCase()];if(rv)r.role=rv;else r.err="رتبة غير معروفة: "+f[4]}
    if(!r.err&&seen[r.name])r.err="الاسم موجود أصلاً";
    if(!r.err)seen[r.name]=1;
    out.push(r);
  });
  return out;
}

  var rows=parseBulk(),box=$("#blPrev");
  if(box)box.innerHTML=rows.length?
    '<div class="sec-title" style="margin-bottom:8px">'+rows.filter(function(r){return !r.err}).length+" جاهز من "+rows.length+' سطر</div><div class="tbox"><table><tbody>'+

var LOGO="icon-512.png",LOGOIMG=null;
function loadLogo(cb){
  if(LOGOIMG!==null)return cb();
  var i=new Image();

}
function roundRect(x,a,b,w,h,r){
  x.beginPath();
  if(x.roundRect){x.roundRect(a,b,w,h,r);return}
  x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();
}
var FACES={};
/* photos for the exported image: a face that will not load is simply skipped */
function loadFaces(sel,cb){
  var ids=[];
  (sel||[]).forEach(function(pid){
    var p=pid?byId(S.players,pid):null;
    if(p&&p.photo&&!FACES[p.photo]&&ids.indexOf(p.photo)<0)ids.push(p.photo);
  });
  if(!ids.length)return cb();
  var left=ids.length,fired=false;
  function done(){if(!fired){fired=true;clearTimeout(tm);cb()}}
  var tm=setTimeout(done,4000);
  ids.forEach(function(id){
    var im=new Image();
    im.onload=function(){FACES[id]=im;if(!--left)done()};
    im.onerror=function(){if(!--left)done()};
    im.src=/^data:/.test(id)?id:"/_blob/"+id;
  });
}
function exportLineup(){
  if(!S.dl){toast("التصدير غير متاح هنا");return}
  var m=byId(S.matches,S.ui.lineupMatch);if(!m)return;
  var L=m.lineup||{formation:"4-3-3",slots:[],bench:[]};
  var form=FORMS[L.formation]?L.formation:"4-3-3",slots=FORMS[form],sel=L.slots||[];
  var W=1080,H=1350,cv=document.createElement("canvas");cv.width=W;cv.height=H;
  var g=cv.getContext("2d");
  function draw(){
    g.fillStyle="#0A0E13";g.fillRect(0,0,W,H);
    g.textAlign="center";
    if(LOGOIMG){
      g.save();roundRect(g,W/2-50,32,100,100,23);g.clip();
      g.drawImage(LOGOIMG,W/2-50,32,100,100);g.restore();
    }else{
      g.save();g.direction="ltr";g.fillStyle="#E8B33C";g.font="700 46px 'Readex Pro',sans-serif";
      g.fillText("N Y X O N",W/2,104);g.restore();
    }
    g.direction="rtl";
    g.fillStyle="#E9EEF4";g.font="600 40px 'IBM Plex Sans Arabic',sans-serif";
    g.fillText(clubName(m.clubId)+" × "+(m.opponent||"خصم"),W/2,188);
    g.fillStyle="#7D8B9B";g.font="400 26px 'IBM Plex Sans Arabic',sans-serif";
    g.fillText(dfmt(m.date),W/2,230);
    var px=70,py=266,pw=W-140,ph=872;
    g.fillStyle="#141C26";roundRect(g,px,py,pw,ph,20);g.fill();
    for(var i=0;i<10;i+=2){g.fillStyle="rgba(255,255,255,.022)";g.fillRect(px,py+ph*(i/10),pw,ph/10)}
    g.strokeStyle="rgba(255,255,255,.14)";g.lineWidth=2;
    roundRect(g,px,py,pw,ph,20);g.stroke();
    g.beginPath();g.moveTo(px,py+ph/2);g.lineTo(px+pw,py+ph/2);g.stroke();
    g.beginPath();g.arc(px+pw/2,py+ph/2,pw*0.135,0,Math.PI*2);g.stroke();
    g.strokeRect(px+pw*0.21,py+ph*0.85,pw*0.58,ph*0.15);
    g.strokeRect(px+pw*0.21,py,pw*0.58,ph*0.15);
    slots.forEach(function(s,k){

    ask("تشيل الاسم عن هذا الجهاز وتختار من جديد؟","شيل الاسم",function(){
      S.localId="";try{localStorage.removeItem("nyxon.me")}catch(e5){}
      render();toast("اختر اسمك من جديد");
    });return;
  }
  if(a==="lineup-approve"){
    if(!canApprove())return;
    var La=lineupOf();
    if(!slotsArr(La).filter(Boolean).length){toast("حط اللاعبين في المراكز أول");return}
    saveLineup({formation:La.formation||"4-3-3",slots:La.slots||[],bench:La.bench||[],locked:true},"اعتمدت التشكيلة");return;
  }
  if(a==="lineup-unlock"){
    if(!canApprove())return;
    var Lu=lineupOf();
    saveLineup({formation:Lu.formation||"4-3-3",slots:Lu.slots||[],bench:Lu.bench||[],locked:false},"انفتح التعديل");return;
  }
  /* lineup */
  if(a==="export-lineup"){exportLineup();return}
  if(a==="formation"){saveLineup({formation:e.value,slots:[],bench:lineupOf().bench||[]},"تغيرت الخطة");return}
  if(a==="clear-lineup"){ask("تفرّغ التشكيلة؟","تفريغ",function(){saveLineup({formation:lineupOf().formation||"4-3-3",slots:[],bench:[]},"انفرغت")});return}
  if(a==="slot"){
    if(!canLineup())return;
    var idx=n(id),L=lineupOf(),cur=(L.slots||[])[idx];
    var pool=lineupPool(L);
    sheetPickPlayer("اختر لاعب للمركز "+FORMS[L.formation||"4-3-3"][idx][0],pool,"slot-set",
      cur?'<button class="btn danger" type="button" data-act="slot-clear">إفراغ المركز</button>':"");
    S.slotIdx=idx;return;
  }
  if(a==="slot-set"){
    var L2=lineupOf(),sl=slotsArr(L2);
    for(var i2=0;i2<sl.length;i2++)if(sl[i2]===id)sl[i2]=null;
    sl[S.slotIdx]=id;
    saveLineup({formation:L2.formation||"4-3-3",slots:sl,bench:(L2.bench||[]).filter(function(x){return x!==id})},"انضاف");
    closeSheet();return;
  }
  if(a==="slot-clear"){
    var L3=lineupOf(),sl3=slotsArr(L3);sl3[S.slotIdx]=null;
    saveLineup({formation:L3.formation||"4-3-3",slots:sl3,bench:L3.bench||[]},"انفرغ");closeSheet();return;
  }
  if(a==="bench-add"){
    if(!canLineup())return;
    sheetPickPlayer("أضف للاحتياط",lineupPool(lineupOf()),"bench-set");return;
  }
  if(a==="bench-set"){
    var L4=lineupOf(),bn=(L4.bench||[]).slice();
    if(bn.indexOf(id)<0)bn.push(id);
    saveLineup({formation:L4.formation||"4-3-3",slots:L4.slots||[],bench:bn},"انضاف للاحتياط");closeSheet();return;
  }
  if(a==="bench-del"){
    var L5=lineupOf();
    saveLineup({formation:L5.formation||"4-3-3",slots:L5.slots||[],bench:(L5.bench||[]).filter(function(x){return x!==id})},"انشال");return;
  }
}
function lineupOf(mid){var m=byId(S.matches,mid||S.ui.lineupMatch);return (m&&m.lineup)||{formation:"4-3-3",slots:[],bench:[]}}
/* slots always as long as the formation, holes as null — never a sparse array */
function slotsArr(L){
  var f=FORMS[L.formation]?L.formation:"4-3-3",len=FORMS[f].length,out=[],src=L.slots||[];
  for(var i=0;i<len;i++)out.push(src[i]==null?null:src[i]);
  return out;
}
function lineupPool(L){
  var m=byId(S.matches,S.ui.lineupMatch);if(!m)return [];
  var used={};(L.slots||[]).forEach(function(x){if(x)used[x]=true});
  return clubPlayers(m.clubId).filter(function(p){
    if(used[p.id])return false;
    if(S.ui.confirmedOnly&&m.status!=="played"&&attOf(m,p.id)!=="in")return false;
    return true;
  });
}
function saveLineup(L,msg){
  var m=byId(S.matches,S.ui.lineupMatch);if(!m)return;
  var old=m.lineup||{},mine=me();
  var b={};for(var k in m)if(k!=="id")b[k]=m[k];
  b.lineup={formation:L.formation,
    slots:slotsArr({formation:L.formation,slots:L.slots||[]}),
    bench:L.bench||[],
    locked:L.locked===undefined?!!old.locked:!!L.locked,
    by:mine?mine.id:(old.by||""),
    at:new Date().toISOString()};
  save("matches/"+m.id,b).then(function(){if(msg)toast(msg)});
}
function setAtt(m,pid,status,admin){
  if(!m)return;
  save("attendance/"+m.id+"__"+pid,{matchId:m.id,playerId:pid,status:status,
    at:new Date().toISOString(),by:admin?"staff":"self"}).then(function(){
    if(S.modal)sheetAtt(byId(S.matches,m.id)||m);
    toast(status==="in"?"تأكد حضورك":status==="excused"?"انسجل غياب بعذر":"انسجل غياب");
  });
}

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
  var t=ev.target.closest?ev.target.closest("[data-act]"):null;
  if(!t||t.tagName==="SELECT"||t.tagName==="INPUT")return;
  var a=t.getAttribute("data-act");
  if(a==="close"||a==="confirm-yes"||canWriteData()||["view","period","cat","scope","all-past","stats-view","scoring","clubs","pick-match","conf-only","export-lineup","csv-leaders","as-player","claim-me","local-ask","local-pick","local-reset","signin","signout"].indexOf(a)>=0){
    ev.preventDefault();act(a,t.getAttribute("data-id"),t.getAttribute("data-v"),t);
  }else{toast(S.uid?"صلاحيتك عرض فقط — الإدارة والكابتن هم اللي يكتبون":"سجّل دخولك أول")}
},false);
document.addEventListener("change",function(ev){
  var t=ev.target.closest?ev.target.closest("[data-act]"):null;
  if(!t)return;
  act(t.getAttribute("data-act"),t.getAttribute("data-id"),t.getAttribute("data-v"),t);
},false);
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&S.modal)closeSheet()},false);
/* a refused write already told the person what happened; keep the browser
   from reporting the very same rejection a second time */
window.addEventListener("unhandledrejection",function(ev){
  var r=ev&&ev.reason;
  if(r&&typeof r==="object"&&typeof r.code==="string"&&!r.stack)ev.preventDefault();
},false);
document.addEventListener("input",function(ev){
  if(S.resultMatch)recalcResult();
  if($("#blPrev"))bulkPreview();
  if(ev&&ev.target&&ev.target.id==="pickQ"){
    S.pickQ=ev.target.value;
    var pl=$("#pickList");
    if(pl)pl.innerHTML=pickListHtml(S.canWrite===false||!S.uid);
  }
},false);
document.addEventListener("change",function(){if(S.resultMatch)recalcResult()},false);
$("#modal").addEventListener("keydown",function(ev){
  if(ev.key!=="Enter")return;
  var t=ev.target;
  if(!t||t.tagName!=="INPUT"||t.getAttribute("type")!=="number")return;
  ev.preventDefault();
  var list=Array.prototype.slice.call(this.querySelectorAll('input[type="number"]'));
  var i=list.indexOf(t);
  if(i>=0&&list[i+1])list[i+1].focus();
},false);
$("#modal").addEventListener("click",function(ev){if(ev.target===this)closeSheet()},false);
window.addEventListener("hashchange",function(){
  var h=String(location.hash||"").replace("#","");
  if(byId(ALLVIEWS,h)){S.view=h;S.pinned=true;render()}
},false);

/* ---------- boot ---------- */
(function(){
  try{S.localId=localStorage.getItem("nyxon.me")||""}catch(e){}
  var h=String(location.hash||"").replace("#","");
  if(byId(ALLVIEWS,h)){S.view=h;S.pinned=true}
  S.booted=true;render();
  /* the runtime calls this whenever the person signs in or out */
  window.nyxonAuthChanged=function(uid){
    S.uid=uid||null;
    S.owner=!!(uid&&window.NYXON_CONFIG&&uid===window.NYXON_CONFIG.ownerUid);
    S.canWrite=uid?true:false;
    S.asPlayer=false;
    render();
  };
  if(!window.claude||!window.claude.use){S.offline=true;S.capsDone=true;render();return}
  setTimeout(hideSplash,7000);
  Promise.all([window.claude.use("db"),window.claude.use("user"),window.claude.use("downloads"),
    window.claude.use("assets")]).then(function(r){
    S.db=r[0];S.user=r[1];S.dl=r[2];S.assets=r[3];
    if(!S.db){S.offline=true;S.capsDone=true;render();return}
    var jobs=[];
    if(S.user){
      jobs.push(Promise.resolve(S.user.id()).then(function(x){S.uid=x}).catch(function(){}));
      try{jobs.push(Promise.resolve(S.user.canEdit()).then(function(x){S.adminLevel=!!x}).catch(function(){}))}catch(e){}
      try{jobs.push(Promise.resolve(S.user.isOwner()).then(function(x){S.owner=!!x}).catch(function(){}))}catch(e){}
      try{jobs.push(Promise.resolve(S.user.can("data.write")).then(function(x){S.canWrite=x}).catch(function(){}))}catch(e){}
    }
    Promise.all(jobs).then(function(){S.capsDone=true;subscribe();render()},
      function(){S.capsDone=true;subscribe();render()});
  },function(){S.offline=true;S.capsDone=true;render()});
})();
})();
</script>
<script>
/* Offline caching is off while we get the site settled: a stale cached page is
   the hardest kind of bug to see. This also clears any worker a previous visit
   installed. */
if("serviceWorker" in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){
    rs.forEach(function(r){r.unregister()});
  }).catch(function(){});
  if(window.caches&&caches.keys)caches.keys().then(function(ks){
    ks.forEach(function(k){caches.delete(k)});
  }).catch(function(){});
}
</script>
